name: One-time website copy update

on:
  push:
    paths:
      - ".github/workflows/one-time-copy-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update website copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "when the screen goes dark, i'm either on the asphalt or a basketball court.":
                  "when the screen goes dark, i'm either out running or on a basketball court.",
              "fuel . fueled almost entirely by good sushi, ramen, and salmon bagel":
                  "fuel . fueled almost entirely by good sushi, ramen, and salmon bagels",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 2:
                  raise SystemExit(f"Expected 2 occurrences of {old!r}, found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Refine personal website copy"
          git push
