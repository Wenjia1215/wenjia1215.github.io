name: One-time ComplianceGPT live link update

on:
  push:
    paths:
      - ".github/workflows/one-time-live-link-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Link ComplianceGPT live label
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<a class="entry" href="#research" data-modal="research">ComplianceGPT</a> . verifiable rag systems for strict compliance <span class="live">[live]</span>'
          new = '<a class="entry" href="#research" data-modal="research">ComplianceGPT</a> . verifiable rag systems for strict compliance <a class="live" href="https://github.com/Wenjia1215/ComplianceGPT" target="_blank" rel="noopener noreferrer" aria-label="Open the ComplianceGPT GitHub repository">[live]</a>'

          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 ComplianceGPT live-label occurrences, found {count}")

          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Link ComplianceGPT live label to repository"
          git push
